    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .plot-box {
            min-height: 60px;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .plot-box:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>

        let currentPlotKey = null;

        function getPlotColor(size, status) {
            if (status === 'sold') return 'bg-gray-400 border-gray-600';
            if (size === "120") return 'bg-yellow-100 border-yellow-400';
            if (size === "240") return 'bg-white border-blue-400';
            return 'bg-green-200 border-green-500';
        }

        function renderPlots() {
            const grid = document.getElementById('plotGrid');
            grid.innerHTML = '';
            
            Object.entries(plots).forEach(([key, plot]) => {
                const plotDiv = document.createElement('div');
                plotDiv.className = `plot-box ${getPlotColor(plot.size, plot.status)} border-2 p-2 rounded flex flex-col justify-center items-center font-semibold`;
                plotDiv.innerHTML = `
                    <div class="text-red-600">${plot.number}</div>
                    <div class="text-blue-600 text-[10px]">${plot.size}</div>
                `;
                plotDiv.onclick = () => openModal(key);
                grid.appendChild(plotDiv);
            });
        }

        function openModal(plotKey) {
            currentPlotKey = plotKey;
            const plot = plots[plotKey];
            
            document.getElementById('modalPlotNumber').textContent = plot.number;
            document.getElementById('modalSize').textContent = plot.size + ' SQ.YARDS';
            document.getElementById('modalDirection').textContent = plot.direction;
            
            const statusEl = document.getElementById('modalStatus');
            statusEl.textContent = plot.status.toUpperCase();
            statusEl.className = `text-xl font-bold ${plot.status === 'available' ? 'text-green-600' : 'text-red-600'}`;
            
            const btn = document.getElementById('toggleButton');
            btn.textContent = `Mark as ${plot.status === 'available' ? 'SOLD' : 'AVAILABLE'}`;
            btn.className = `w-full py-3 rounded-lg font-semibold transition-colors ${
                plot.status === 'available' 
                    ? 'bg-red-500 hover:bg-red-600 text-white' 
                    : 'bg-green-500 hover:bg-green-600 text-white'
            }`;
            
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            currentPlotKey = null;
        }

        function toggleStatus() {
            if (currentPlotKey) {
                plots[currentPlotKey].status = plots[currentPlotKey].status === 'available' ? 'sold' : 'available';
                renderPlots();
                openModal(currentPlotKey);
            }
        }

        // Close modal when clicking outside
        document.getElementById('modal').onclick = function(e) {
            if (e.target === this) {
                closeModal();
            }
        };

        // Initial render
        renderPlots();
